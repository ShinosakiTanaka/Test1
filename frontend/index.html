<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเสนอหัวข้อโครงงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div class="max-w-5xl mx-auto py-10 px-4">
    <!-- ส่วนหัวหน้าเว็บ -->
    <header class="mb-8 flex justify-between items-center border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">ระบบเสนอหัวข้อโครงงาน (Project Proposal)</h1>
        <p class="text-sm text-slate-500">ยื่นแบบเสนอหัวข้อและติดตามสถานะ</p>
      </div>
      <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">REST API Active</span>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- แบบฟอร์มเสนอหัวข้อ -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">ยื่นเสนอหัวข้อใหม่</h2>
        <form id="proposalForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อหัวข้อโครงงาน</label>
            <input type="text" id="topicName" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500" placeholder="เช่น ระบบบริหารจัดการ...">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อผู้เสนอ / รหัสนักศึกษา</label>
            <input type="text" id="studentName" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500" placeholder="เช่น นายจักรพงศ์ (65xxxxxx)">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">อาจารย์ที่ปรึกษา</label>
            <input type="text" id="advisorName" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500" placeholder="เช่น อาจารย์ประจำสาขา">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">รายละเอียดโดยย่อ</label>
            <textarea id="description" rows="3" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500" placeholder="อธิบายวัตถุประสงค์โดยสรุป"></textarea>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition shadow">
            บันทึกและส่งเสนอหัวข้อ
          </button>
        </form>
      </div>

      <!-- ตารางแสดงรายการ -->
      <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-slate-800">รายการหัวข้อที่เสนอ</h2>
          <span id="proposalCount" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 รายการ</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 text-xs uppercase border-b">
              <tr>
                <th class="py-3 px-3">ชื่อโครงงาน</th>
                <th class="py-3 px-3">ผู้เสนอ</th>
                <th class="py-3 px-3">อาจารย์</th>
                <th class="py-3 px-3">สถานะ</th>
                <th class="py-3 px-3 text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="proposalList" class="divide-y divide-slate-100">
              <!-- ข้อมูลจะถูก render ผ่าน API -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/proposals';
    const form = document.getElementById('proposalForm');
    const proposalList = document.getElementById('proposalList');
    const proposalCount = document.getElementById('proposalCount');

    // ดึงรายการจากเซิร์ฟเวอร์
    async function fetchProposals() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        proposalList.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-rose-500">ไม่สามารถเชื่อมต่อ Server พอร์ต 5000 ได้ กรุณาเปิดรัน backend</td></tr>`;
      }
    }

    // เรนเดอร์ตารางข้อมูล
    function renderTable(items) {
      proposalCount.textContent = `${items.length} รายการ`;
      if (items.length === 0) {
        proposalList.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">ยังไม่มีข้อมูล</td></tr>`;
        return;
      }
      proposalList.innerHTML = items.map(p => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-3 font-medium text-slate-900">${p.topicName}</td>
          <td class="py-3 px-3 text-slate-600">${p.studentName}</td>
          <td class="py-3 px-3 text-slate-600">${p.advisorName}</td>
          <td class="py-3 px-3">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
              รอพิจารณา
            </span>
          </td>
          <td class="py-3 px-3 text-center">
            <button onclick="removeProposal(${p.id})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">ลบ</button>
          </td>
        </tr>
      `).join('');
    }

    // ส่งฟอร์มสร้างรายการใหม่ไปยังเซิร์ฟเวอร์
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        topicName: document.getElementById('topicName').value,
        studentName: document.getElementById('studentName').value,
        advisorName: document.getElementById('advisorName').value,
        description: document.getElementById('description').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        form.reset();
        fetchProposals();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
      }
    });

    // ลบรายการ
    window.removeProposal = async function(id) {
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchProposals();
      } catch (err) {
        alert('ไม่สามารถลบรายการได้');
      }
    };

    fetchProposals();
  </script>
</body>
</html>
